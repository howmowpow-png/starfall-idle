<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starfall Idle">
<meta name="theme-color" content="#0b0a1f">
<title>Starfall Idle</title>
<style>
:root{
  --bg:#0b0a1f; --panel:#15132e; --panel2:#1e1b40; --line:#2d2a5a; --text:#f1efff; --dim:#9a96c4;
  --gold:#ffd24a; --star:#8fe3ff; --R1:#c3d2ea; --R2:#6f8fc4; --SR1:#d3a2ff; --SR2:#7a3fe0; --SSR1:#ffe9a0; --SSR2:#f0a91e;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;touch-action:manipulation;cursor:pointer}
[data-act]{cursor:pointer}
textarea{font:12px ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}

#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:540px;display:flex;flex-direction:column;
  padding-left:var(--sal);padding-right:var(--sar);background:var(--bg)}

/* ---------- top bar ---------- */
#topbar{flex:0 0 auto;padding:calc(var(--sat) + 4px) 8px 4px;display:flex;align-items:center;gap:6px;background:#0b0a1f;z-index:5}
.cur{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:0 10px;height:34px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.cur b{overflow:hidden;text-overflow:ellipsis}
.cur.gold b{color:var(--gold)} .cur.star b{color:var(--star)}
.cur.stage{flex:0 0 auto;font-size:12px;color:var(--dim)} .cur.stage b{color:var(--text);font-size:14px}
.bump{animation:bump .25s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
#gear{flex:0 0 44px;height:44px;font-size:22px;border-radius:12px}
#gear:active{background:var(--panel2)}

/* ---------- battle ---------- */
#battle{flex:0 0 auto;height:42%;min-height:250px;max-height:400px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#070824 0%,#151049 45%,#3a1d63 80%,#6a2c62 100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#battle:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:120px;pointer-events:none;
  background:radial-gradient(60% 100% at 20% 100%,#120b2c 60%,transparent 61%),radial-gradient(55% 90% at 78% 100%,#1a0f38 60%,transparent 61%)}
#sky{position:absolute;inset:0;pointer-events:none}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
#sky .moon{position:absolute;right:26px;top:36px;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe6,#ffe9a8 60%,#d9b765);box-shadow:0 0 30px 8px rgba(255,235,170,.25);opacity:.85}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#bhead{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:6px 10px 0}
#stagelbl{font-weight:800;font-size:15px;text-shadow:0 1px 3px #000}
#stagelbl small{font-weight:600;color:var(--dim);margin-left:6px;font-size:12px}
#stagelbl.boss{color:#ff8a8a}
#autobtn{min-height:44px;margin:-8px -4px -8px 0;padding:0 4px;display:flex;align-items:center}
#autobtn span{display:block;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--dim)}
#autobtn.on span{color:#9dffb0;border-color:#3d8f55;background:rgba(30,90,50,.45)}
#hpwrap{position:relative;z-index:3;margin:4px auto 0;width:74%;max-width:300px;text-align:center;pointer-events:none}
#ename{font-size:12px;font-weight:700;text-shadow:0 1px 3px #000;margin-bottom:2px}
#hpbar{height:14px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);overflow:hidden;position:relative}
#hpfill{position:absolute;inset:0;transform-origin:left center;background:linear-gradient(180deg,#ff7b7b,#d92f4a);will-change:transform}
#hptext{position:absolute;inset:0;font-size:10px;line-height:12px;font-weight:800;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
#timer{margin-top:3px;height:14px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,210,74,.5);overflow:hidden;position:relative}
#timerfill{position:absolute;inset:0;transform-origin:left center;background:linear-gradient(180deg,#ffe07a,#f09a1e)}
#timertext{position:absolute;inset:0;font-size:10px;line-height:12px;font-weight:800;text-shadow:0 1px 2px #000}
#ezone{position:relative;z-index:2;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.enemy{position:relative;animation:bob 2.2s ease-in-out infinite}
.enemy.pop{animation:epop .28s cubic-bezier(.3,1.5,.5,1),bob 2.2s ease-in-out .28s infinite}
.enemy.dying{animation:edie .28s ease-in forwards}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.02,.98)}}
@keyframes epop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes edie{to{transform:scale(.1) rotate(25deg);opacity:0}}
.blob{width:var(--es);height:var(--es);display:flex;align-items:center;justify-content:center;font-size:calc(var(--es)*.56);line-height:1;
  border-radius:48% 52% 50% 50%/60% 60% 40% 40%;background-color:var(--c);
  background-image:radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),transparent 38%),radial-gradient(circle at 60% 90%,rgba(0,0,0,.35),transparent 60%);
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 10px 16px rgba(0,0,0,.45)}
.blob.hit{animation:hit .12s linear}
.blob.hit2{animation:hit2 .12s linear}
@keyframes hit{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px) scale(.97)}75%{transform:translate(4px,-2px)}100%{transform:translate(0,0)}}
@keyframes hit2{0%{transform:translate(0,0)}25%{transform:translate(4px,2px) scale(.97)}75%{transform:translate(-4px,-2px)}100%{transform:translate(0,0)}}
.enemy.boss .blob{box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 10px 16px rgba(0,0,0,.45),0 0 26px 4px rgba(255,90,90,.55)}
.crown{position:absolute;left:50%;top:0;transform:translate(-50%,-62%) rotate(-6deg);font-size:calc(var(--es)*.4);line-height:1;filter:drop-shadow(0 2px 3px #000);z-index:2}
#floats{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.fl{position:absolute;font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8);white-space:nowrap;
  animation:flup .8s ease-out forwards;transform:translate(-50%,-50%);font-variant-numeric:tabular-nums}
.fl.tap{font-size:19px;color:#dff3ff}
.fl.crit{font-size:27px;color:var(--gold);text-shadow:0 2px 0 #7a4b00,0 0 12px rgba(255,200,60,.9);animation:flcrit .95s ease-out forwards;z-index:2}
.fl.coin{font-size:14px;color:var(--gold);animation-duration:1s}
.fl.starp{font-size:20px;color:var(--star);animation-duration:1.2s}
@keyframes flup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
@keyframes flcrit{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.5)}30%{transform:translate(-50%,-100%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1.1)}}
#nextbtn{position:absolute;right:8px;top:50%;z-index:7;min-height:44px;padding:0 12px;border-radius:14px;font-weight:800;font-size:13px;
  background:linear-gradient(180deg,#ff8a5c,#d9342f);box-shadow:0 3px 0 #7a1512,0 6px 14px rgba(0,0,0,.5);animation:pulse 1.2s ease-in-out infinite}
#nextbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a1512}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
#bfoot{position:relative;z-index:3;padding:0 8px 6px;text-align:center}
#bstats{font-size:11px;font-weight:700;color:#d8d4ff;text-shadow:0 1px 2px #000;margin-bottom:3px;white-space:nowrap}
#bstats span{margin:0 5px}
#prow{display:flex;justify-content:center;gap:6px}
.mini{width:46px;height:50px;border-radius:10px;padding:2px;position:relative}
.mini .cin{border-radius:8px;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1.1}
.mini small{font-size:9px;font-weight:800;line-height:1}
.mini.empty{border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:20px}

/* shooting star in the sky */
.sstar{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;z-index:8;animation:sfly linear forwards;touch-action:manipulation}
@keyframes sfly{from{transform:translate(var(--x0),var(--y0))}to{transform:translate(var(--x1),var(--y1))}}
.sstar .tail{position:absolute;left:50%;top:50%;width:90px;height:4px;margin-top:-2px;transform-origin:left center;border-radius:4px;
  background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(143,227,255,.5) 40%,transparent)}
.sstar .head{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;
  background:radial-gradient(circle,#fff 30%,#bdefff 55%,transparent 72%);box-shadow:0 0 16px 6px rgba(160,230,255,.8);animation:spulse .5s ease-in-out infinite}
.sstar.golden .head{background:radial-gradient(circle,#fff 30%,#ffe27a 55%,transparent 72%);box-shadow:0 0 20px 8px rgba(255,210,74,.9)}
.sstar.golden .tail{background:linear-gradient(90deg,#fff,rgba(255,210,74,.7) 40%,transparent)}
@keyframes spulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

/* ---------- panel ---------- */
#panel{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 12px 16px;background:var(--panel)}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:15px;margin:2px 0 8px}
.sec span{font-size:12px;color:var(--dim);font-weight:600}
.hint{font-size:12px;color:var(--dim);margin:6px 0 10px;line-height:1.35}
.btn{min-height:44px;padding:6px 12px;border-radius:12px;font-weight:800;background:linear-gradient(180deg,#5d55d6,#3b33a6);
  box-shadow:0 3px 0 #231d70;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;color:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #231d70}
.btn small{font-size:11px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.btn.off{filter:grayscale(.7) brightness(.6)}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#e8961c);box-shadow:0 3px 0 #8a5200;color:#3b2200}
.btn.gold small{color:#5a3500}
.btn.cyan{background:linear-gradient(180deg,#5fd0ff,#2b7fd6);box-shadow:0 3px 0 #164a85}
.btn.cyan small{color:#e8fbff}
.btn.red{background:linear-gradient(180deg,#e0566a,#a8263c);box-shadow:0 3px 0 #5e0f1e}
.btn.ghost{background:var(--panel2);box-shadow:0 3px 0 #0d0b22;border:1px solid var(--line)}
.btn.wide{display:flex;width:100%}

/* hero card */
.card{width:var(--w);height:calc(var(--w)*1.5);font-size:calc(var(--w)/10);padding:.32em;border-radius:1.1em;position:relative;flex:0 0 auto;
  background:linear-gradient(160deg,var(--R1),var(--R2));box-shadow:0 2px 6px rgba(0,0,0,.45)}
.card.SR,.mini.SR{background:linear-gradient(160deg,var(--SR1),var(--SR2))}
.card.R,.mini.R{background:linear-gradient(160deg,var(--R1),var(--R2))}
.card.SSR,.mini.SSR{background:linear-gradient(115deg,#ffd76a,#fff6c9,#ff9ad5,#9ad5ff,#b6ffb0,#ffd76a,#fff6c9,#ff9ad5);background-size:400% 400%;animation:shim 3.5s linear infinite}
@keyframes shim{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.card .cin{width:100%;height:100%;border-radius:.85em;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.card.SSR .cin:after{content:"";position:absolute;top:-20%;bottom:-20%;width:45%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sheen 2.8s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
.el-fire .cin{background:linear-gradient(170deg,#ff8a45,#c22a1a)}
.el-water .cin{background:linear-gradient(170deg,#49aaff,#1c47b8)}
.el-wind .cin{background:linear-gradient(170deg,#58dd86,#157a43)}
.el-light .cin{background:linear-gradient(170deg,#fff6cf,#e0a93c);color:#4a3200}
.el-dark .cin{background:linear-gradient(170deg,#7445c9,#231047)}
.crar{position:absolute;left:.45em;top:.3em;font-size:1.15em;font-weight:900;font-style:italic;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.el-light .crar{text-shadow:none}
.clv{position:absolute;right:.45em;top:.35em;font-size:1.05em;font-weight:800;opacity:.9}
.cemo{font-size:4em;line-height:1.15;filter:drop-shadow(0 .06em .08em rgba(0,0,0,.4))}
.cname{font-size:1.38em;font-weight:800;max-width:96%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1em}
.cstars{font-size:1.2em;letter-spacing:.05em;color:rgba(0,0,0,.28);line-height:1.2}
.cstars b{color:#ffe14a;text-shadow:0 0 .2em #a86a00,0 1px 1px rgba(0,0,0,.6)}
.card.locked{background:#2a2845;box-shadow:none}
.card.locked .cin{background:#0e0d1c;color:#4c4a6e}
.card.locked .cemo{filter:brightness(0) opacity(.55);position:relative}
.card.locked .q{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:3em;font-weight:900;color:#6d6a99}
.card.sel{outline:3px solid #fff;outline-offset:1px}
.card .inp{position:absolute;right:-.3em;bottom:-.3em;background:#2ecc71;color:#042;border-radius:999px;font-size:1.1em;font-weight:900;padding:.15em .5em;border:2px solid #0b0a1f}

/* heroes list */
.hrow{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.hrow.inparty{border-color:#4b7f5c}
.htop{display:flex;gap:10px;align-items:center}
.hinfo{flex:1;min-width:0}
.hname{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:900;font-style:italic;padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px;color:#111}
.tag.R{background:var(--R1)} .tag.SR{background:var(--SR1)} .tag.SSR{background:linear-gradient(90deg,#ffd76a,#ff9ad5,#9ad5ff)}
.hsub{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstat{font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
.hstat b{color:var(--gold)} .hstat i{font-style:normal;color:var(--dim);font-size:11px;margin-left:6px}
.hbtns{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;margin-top:8px}

/* party */
.pslots{display:flex;gap:6px;justify-content:space-between;margin-bottom:8px}
.pslot{border-radius:12px;position:relative}
.pslot.sel{outline:3px solid #fff;outline-offset:2px}
.pempty{width:var(--w);height:calc(var(--w)*1.5);border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--dim)}
.bonus{display:flex;justify-content:space-between;font-size:12px;padding:6px 10px;border-radius:10px;color:var(--dim);border:1px solid transparent}
.bonus.on{background:rgba(46,204,113,.14);border-color:#2e9c5c;color:#b9ffd0;font-weight:800}
.pstats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.grid{display:flex;flex-wrap:wrap;gap:8px}

/* summon tab */
.banner{border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden;border:1px solid #6b5a2a;
  background:radial-gradient(120% 140% at 0% 0%,#4b3a8f,#1a1440 55%,#0d0a26)}
.banner:before{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 50% 80%,#fff,transparent),radial-gradient(1px 1px at 35% 60%,#fff,transparent);opacity:.7}
.binfo{position:relative;flex:1;min-width:0}
.btitle{font-size:18px;font-weight:900;background:linear-gradient(90deg,#ffe9a0,#ff9ad5,#9ad5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bfeat{font-size:12px;margin-top:3px;line-height:1.35} .bfeat b{color:var(--gold)}
.pity{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,210,74,.15);border:1px solid rgba(255,210,74,.5);color:var(--gold)}
.sbtns{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;margin:10px 0}
.sbtns .btn{min-height:56px;font-size:15px}
.glowpulse{animation:gp 1s ease-in-out infinite}
@keyframes gp{0%,100%{box-shadow:0 3px 0 #8a5200,0 0 0 0 rgba(255,210,74,.8)}50%{box-shadow:0 3px 0 #8a5200,0 0 0 9px rgba(255,210,74,0)}}
details{background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
summary{min-height:44px;display:flex;align-items:center;padding:0 12px;font-weight:700;list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:after{content:"▾";margin-left:auto;color:var(--dim)}
details[open] summary:after{content:"▴"}
.dbody{padding:0 12px 10px;font-size:12px;line-height:1.6;color:#cfcbf0}
.hist{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid rgba(255,255,255,.06)}
.cR{color:#a9c1ea} .cSR{color:#d3a2ff} .cSSR{color:var(--gold);font-weight:800}

/* settings */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;min-height:56px}
.row .lbl{font-weight:700} .row .lbl small{display:block;font-weight:500;color:var(--dim);font-size:11px;margin-top:2px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.box textarea{width:100%;height:64px;margin:8px 0;background:#0b0a1f;color:#cfe;border:1px solid var(--line);border-radius:8px;padding:6px;resize:none}
.box .brow{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:12px;margin-top:6px;color:#9dffb0;min-height:14px} .msg.err{color:#ff9a9a}
#ver{display:block;width:100%;min-height:44px;text-align:center;color:var(--dim);font-size:12px}
.dbg{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- tab bar ---------- */
#tabbar{flex:0 0 auto;display:flex;background:#0b0a1f;border-top:1px solid var(--line);padding-bottom:var(--sab);position:relative;z-index:5}
.tab{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:700;color:var(--dim);position:relative}
.tab i{font-style:normal;font-size:21px;line-height:1.1;filter:grayscale(.6) opacity(.7);transition:transform .15s}
.tab.on{color:#fff} .tab.on i{filter:none;transform:translateY(-2px) scale(1.12)}
.tab.on:before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#8fe3ff,#d3a2ff)}

<script>
'use strict';
/* =====================================================================
   CONFIG — every tunable number lives here.
   ===================================================================== */
const CONFIG = {
  version: '1.0.0',            // shown in Settings (tap 5x for debug)
  saveVersion: 1,              // bump when the save format changes
  saveKey: 'starfallIdleSave', // localStorage key
  autosaveSec: 10,             // autosave interval (seconds)

  // ---- Battle ----

  bossHpMult: 8,               // boss HP multiplier
  bossTimerSec: 30,            // boss time limit
  bossGoldMult: 5,             // boss gold multiplier
  enemyHpBase: 10,             // EnemyHP(n) = base * growth^(n-1)
  enemyHpGrowth: 1.18,
  goldHpDivisor: 10,           // GoldPerKill(n) = ceil(EnemyHP(n) / divisor)
  tapDpsFraction: 0.05,        // tap damage = max(tapMin, fraction * party DPS)
  tapMin: 1,
  critBaseChance: 0,           // base crit chance (Rogues add to it)
  critMult: 3,                 // crit damage multiplier
  hitIntervalSec: 0.5,         // how often party damage numbers pop / crits roll
  respawnSec: 0.3,             // delay between an enemy dying and the next appearing

  // ---- Heroes ----
  partySize: 5,
  rarities: {                  // rate = summon chance, baseDPS/baseCost feed the formulas below
    R:   { rate: 0.79, baseDPS: 1,  baseCost: 5  },
    SR:  { rate: 0.18, baseDPS: 5,  baseCost: 20 },
    SSR: { rate: 0.03, baseDPS: 20, baseCost: 60 },
  },
  costGrowth: 1.08,            // LevelUpCost(level) = baseCost * growth^level
  milestoneEvery: 25,          // DPS x milestoneMult every N levels
  milestoneMult: 2,
  awakenBonus: 0.5,            // +50% DPS per awakening
  maxAwaken: 5,
  passive: {                   // class passives (active only while in the party)
    warriorOwnDps: 0.25,       // Warrior: +25% own DPS
    mageBossDmg: 0.50,         // Mage: +50% own damage vs bosses
    archerTap: 0.10,           // Archer: +10% party tap damage each
    rogueCrit: 0.05,           // Rogue: +5% party crit chance each
    healerPartyDps: 0.10,      // Healer: +10% party DPS each
  },
  team: {                      // only the single best bonus applies
    element3: 0.25,            // 3+ of one element
    element5: 0.75,            // 5 of one element
    classes5: 0.40,            // 5 different classes
  },

  // ---- Shooting stars ----
  startStars: 500,             // new player gift
  startHero: 'tomo',           // new players own this hero
  skyStarMinSec: 60,           // a shooting star crosses the sky every min..max seconds
  skyStarMaxSec: 120,
  skyStarVisibleSec: 4,        // how long it takes to cross
  skyStarValue: 5,
  skyStarGoldenChance: 0.05,
  skyStarGoldenValue: 25,
  bossFirstClearStars: 25,
  dailyStars: 50,              // once per local calendar day

  // ---- Summoning ----
  pullCost: 50,
  tenPullCost: 500,
  pitySSR: 60,                 // this many pulls without an SSR -> guaranteed SSR
  featured: 'aurelia',         // featured SSR on the standard banner
  featuredChance: 0.5,         // chance an SSR is the featured one
  dupGoldMinutes: 10,          // max-awakened duplicate -> this many minutes of farm income
  historyMax: 50,

  // ---- Offline ----
  offlineRate: 0.5,            // fraction of farm rate paid while away
  offlineCapHours: 8,
  offlineMinSec: 60,           // minimum time away before offline pay applies
};

/* ---------- static data ---------- */
const CLASSES = {
  warrior: { emoji: '⚔️', name: 'Warrior', desc: '+25% own DPS' },
  mage:    { emoji: '🔮', name: 'Mage',    desc: '+50% own damage vs bosses' },
  archer:  { emoji: '🏹', name: 'Archer',  desc: '+10% party tap damage' },
  rogue:   { emoji: '🗡️', name: 'Rogue',   desc: '+5% party crit chance' },
  healer:  { emoji: '✨', name: 'Healer',  desc: '+10% party DPS' },
};
const ELEMENTS = { fire: 'Fire', water: 'Water', wind: 'Wind', light: 'Light', dark: 'Dark' };
const HEROES = [
  ['aurelia','Aurelia','Starborn Saint','SSR','light','healer'],
  ['kurogane','Kurogane','Eclipse Ronin','SSR','dark','warrior'],
  ['seraphine','Seraphine','Tempest Archmage','SSR','wind','mage'],
  ['ignis','Ignis','Phoenix Huntress','SSR','fire','archer'],
  ['lyra','Lyra','Frostbow','SR','water','archer'],
  ['garrick','Garrick','Ironvow','SR','light','warrior'],
  ['mira','Mira','Hexweaver','SR','dark','mage'],
  ['rin','Rin','Swiftfang','SR','wind','rogue'],
  ['coral','Coral','Tidesinger','SR','water','healer'],
  ['haruto','Haruto','Emberblade','SR','fire','warrior'],
  ['pip','Pip','Apprentice Mage','R','fire','mage'],
  ['tomo','Tomo','Village Guard','R','light','warrior'],
  ['elsa','Elsa','Novice Cleric','R','light','healer'],
  ['finn','Finn','Forest Scout','R','wind','archer'],
  ['rook','Rook','Alley Pickpocket','R','dark','rogue'],
  ['mei','Mei','Herbalist','R','water','healer'],
  ['bram','Bram','Squire','R','water','warrior'],
  ['kit','Kit','Fox Ranger','R','wind','rogue'],
].map(a => ({ id: a[0], short: a[1], title: a[2], rar: a[3], el: a[4], cls: a[5],
              full: a[3] === 'SR' ? a[1] + ' ' + a[2] : a[1] + ', ' + a[2] }));
const H = {}; HEROES.forEach(h => H[h.id] = h);
const RAR_ORDER = { SSR: 0, SR: 1, R: 2 };
const ENEMIES = [['🦠','Slime','#56c97f'],['👺','Goblin','#7f9c3a'],['🐺','Wolf','#7d8aa6'],['💀','Skeleton','#b9b3a3'],['🦇','Bat','#6b4a9c'],
  ['🕷️','Spider','#8a3a4a'],['👻','Ghost','#8fb3d9'],['🐍','Serpent','#3a9c7a'],['🍄','Sporeling','#c4573f'],['🦂','Scorpion','#c48a3f']];
const BOSSES = [['👹','Ogre King','#b8323c'],['🧛','Vampire Lord','#5a2a7a'],['🦁','Chimera','#c98a2a'],['🦍','Titan Ape','#555a6a'],['🦑','Kraken','#a83a6a']];
const DRAGON = ['🐉','Starfall Dragon','#1f8f6f'];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SUFFIX = ['', 'K', 'M', 'B', 'T'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return String(Math.floor(n + 1e-9));
  let e = Math.floor(Math.log10(n) / 3), v = n / Math.pow(1000, e);
  if (v >= 999.5) { e++; v /= 1000; }
  if (v < 1) { v = 1; }
  const s = v >= 99.95 ? v.toFixed(0) : v >= 9.995 ? v.toFixed(1) : v.toFixed(2);
  let suf;
  if (e < SUFFIX.length) suf = SUFFIX[e];
  else { const i = e - SUFFIX.length; suf = String.fromCharCode(97 + Math.floor(i / 26) % 26) + String.fromCharCode(97 + i % 26); }
  return s + suf;
}
function fmtTime(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? h + 'h ' + m + 'm' : m ? m + 'm ' + s + 's' : s + 's';
}
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function pct(x) { return Math.round(x * 100) + '%'; }

/* =====================================================================
   STATE + SAVING
   ===================================================================== */
let S;                  // saved state
let isNewPlayer = false;
function newState() {
  const s = { v: CONFIG.saveVersion, gold: 0, stars: CONFIG.startStars, stage: 1, kills: 0, maxStage: 1, bossBest: 0,
    auto: true, farming: false, heroes: {}, party: [], pity: 0, history: [], lastDaily: '', lastSeen: Date.now(), tut: false };
  s.heroes[CONFIG.startHero] = { lvl: 1, awk: 0 };
  for (let i = 0; i < CONFIG.partySize; i++) s.party.push(i === 0 ? CONFIG.startHero : null);
  return s;
}
function sanitize(d) {   // builds a valid state from any (possibly old or broken) save object
  const s = newState();
  if (!d || typeof d !== 'object') return s;
  const num = (k, min, int) => { if (typeof d[k] === 'number' && isFinite(d[k])) s[k] = Math.max(min, int ? Math.floor(d[k]) : d[k]); };
  num('gold', 0); num('stars', 0, 1); num('stage', 1, 1); num('kills', 0, 1); num('maxStage', 1, 1); num('bossBest', 0, 1); num('pity', 0, 1); num('lastSeen', 0);
  s.kills = Math.min(s.kills, CONFIG.enemiesPerStage); s.maxStage = Math.max(s.maxStage, s.stage); s.pity = Math.min(s.pity, CONFIG.pitySSR - 1);
  ['auto', 'farming', 'tut'].forEach(k => { if (typeof d[k] === 'boolean') s[k] = d[k]; });
  if (typeof d.lastDaily === 'string') s.lastDaily = d.lastDaily;
  if (d.heroes && typeof d.heroes === 'object') {
    s.heroes = {};
    for (const id in d.heroes) if (H[id] && d.heroes[id]) {
      const o = d.heroes[id];
      s.heroes[id] = { lvl: Math.max(1, Math.floor(+o.lvl) || 1), awk: clamp(Math.floor(+o.awk) || 0, 0, CONFIG.maxAwaken) };
    }
    if (!Object.keys(s.heroes).length) s.heroes[CONFIG.startHero] = { lvl: 1, awk: 0 };
  }
  s.party = [];
  for (let i = 0; i < CONFIG.partySize; i++) {
    const id = Array.isArray(d.party) ? d.party[i] : null;
    s.party.push(id && s.heroes[id] && s.party.indexOf(id) < 0 ? id : null);
  }
  if (!Array.isArray(d.party)) s.party[0] = Object.keys(s.heroes)[0];
  if (Array.isArray(d.history)) s.history = d.history.filter(x => x && H[x.id]).slice(0, CONFIG.historyMax).map(x => ({ id: x.id, t: +x.t || 0 }));
  return s;
}
function loadGame() {
  let raw = null;
  try { raw = localStorage.getItem(CONFIG.saveKey); } catch (e) {}
  if (raw) { try { S = sanitize(JSON.parse(raw)); return; } catch (e) {} }
  S = newState(); isNewPlayer = true;
}
let storageOK = true;
function saveGame() {
  S.lastSeen = lastT;
  try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; }
}
function exportCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importCode(code) {
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(String(code).trim()))));
    if (!d || typeof d !== 'object' || !d.heroes || typeof d.stage !== 'number') return false;
    S = sanitize(d); lastT = Date.now(); saveGame(); return true;
  } catch (e) { return false; }
}

/* =====================================================================
   GAME MATH
   ===================================================================== */
const isBoss = n => n % CONFIG.bossEvery === 0;
const enemyHP = n => CONFIG.enemyHpBase * Math.pow(CONFIG.enemyHpGrowth, n - 1);
const goldPerKill = n => Math.ceil(enemyHP(n) / CONFIG.goldHpDivisor);
function lvlCost(id, k) {      // total cost of the next k levels (geometric sum)
  const o = S.heroes[id], g = CONFIG.costGrowth, b = CONFIG.rarities[H[id].rar].baseCost;
  return Math.ceil(b * Math.pow(g, o.lvl) * (Math.pow(g, k) - 1) / (g - 1));
}
function maxLevels(id) {       // how many levels the current gold can buy
  const o = S.heroes[id], g = CONFIG.costGrowth, first = CONFIG.rarities[H[id].rar].baseCost * Math.pow(g, o.lvl);
  let k = Math.floor(Math.log(S.gold * (g - 1) / first + 1) / Math.log(g));
  if (!isFinite(k) || k < 0) k = 0;
  while (k > 0 && lvlCost(id, k) > S.gold) k--;
  return k;
}
function heroBaseDPS(id, inParty, boss) {   // hero's own DPS incl. own class passive (no party-wide bonuses)
  const h = H[id], o = S.heroes[id];
  let d = CONFIG.rarities[h.rar].baseDPS * o.lvl * Math.pow(CONFIG.milestoneMult, Math.floor(o.lvl / CONFIG.milestoneEvery)) * (1 + CONFIG.awakenBonus * o.awk);
  if (inParty && h.cls === 'warrior') d *= 1 + CONFIG.passive.warriorOwnDps;
  if (inParty && boss && h.cls === 'mage') d *= 1 + CONFIG.passive.mageBossDmg;
  return d;
}
function teamBonus() {         // the single best team bonus
  const ids = S.party.filter(Boolean), el = {}, cl = {};
  ids.forEach(id => { el[H[id].el] = (el[H[id].el] || 0) + 1; cl[H[id].cls] = 1; });
  const maxEl = Math.max(0, ...Object.values(el));
  const opts = [
    { key: 'element3', ok: maxEl >= 3, v: CONFIG.team.element3 },
    { key: 'element5', ok: maxEl >= 5, v: CONFIG.team.element5 },
    { key: 'classes5', ok: Object.keys(cl).length >= 5, v: CONFIG.team.classes5 },
  ];
  let best = null;
  opts.forEach(o => { if (o.ok && (!best || o.v > best.v)) best = o; });
  return { key: best ? best.key : null, mult: 1 + (best ? best.v : 0) };
}
function partyStats() {
  const ids = S.party.filter(Boolean), c = { healer: 0, archer: 0, rogue: 0 };

  setText($('ename'), (E.boss ? '👑 ' : '') + E.type[1]);
  $('timer').hidden = !E.boss;
  uiDirty = true;
}
function renderPartyRow() {
  $('prow').innerHTML = S.party.map(id => {
    if (!id) return '<div class="mini empty">+</div>';
    const h = H[id];
    return `<div class="mini ${h.rar} el-${h.el}"><div class="cin">${CLASSES[h.cls].emoji}<small>Lv${S.heroes[id].lvl}</small></div></div>`;
  }).join('');
}
function renderBattleChrome() {
  const boss = isBoss(S.stage), sl = $('stagelbl');
  sl.className = boss ? 'boss' : '';
  sl.innerHTML = boss ? `BOSS · Stage ${S.stage}` : `Stage ${S.stage}<small>${S.kills}/${CONFIG.enemiesPerStage}${S.kills >= CONFIG.enemiesPerStage ? ' ✓' : ''}${S.farming ? ' · farming' : ''}</small>`;
  const ab = $('autobtn'); ab.className = S.auto ? 'on' : ''; setText(ab.firstElementChild, 'Auto-advance ' + (S.auto ? 'ON' : 'OFF'));
  const nb = $('nextbtn'), show = canAdvance();
  nb.hidden = !show; if (show) setText(nb, isBoss(S.stage + 1) ? '⚔️ Fight boss' : 'Next stage ▶');
  const ps = partyStats();
  $('bstats').innerHTML = `<span>⚔️ ${fmt(partyDPS(boss))} DPS</span><span>👆 ${fmt(tapDamage())}</span><span>💥 ${pct(ps.crit)} crit</span>`;
  $('sdot').hidden = S.stars < CONFIG.pullCost;
  $('tut').hidden = S.tut || ui.tab === 'summon' || S.stars < CONFIG.tenPullCost || !$('modal').hidden;
}
let lastGoldTxt = '', lastStarTxt = '';
function drawFrame() {
  if (E) {
    $('hpfill').style.transform = 'scaleX(' + (E.dead ? 0 : clamp(E.hp / E.max, 0, 1)) + ')';
    setText($('hptext'), fmt(Math.max(0, Math.ceil(E.hp))) + ' / ' + fmt(Math.ceil(E.max)));
    if (E.boss) {
      $('timerfill').style.transform = 'scaleX(' + clamp(E.timer / CONFIG.bossTimerSec, 0, 1) + ')';
      setText($('timertext'), '⏱ ' + Math.max(0, E.timer).toFixed(1) + 's');
    }
  }
  const g = fmt(S.gold), s = fmt(S.stars);
  if (g !== lastGoldTxt) { lastGoldTxt = g; $('tgold').textContent = g; }
  if (s !== lastStarTxt) { lastStarTxt = s; $('tstars').textContent = s; }
  setText($('tstage'), String(S.stage));
}

/* ---------- tabs ---------- */
function renderAll() { renderPartyRow(); renderBattleChrome(); renderPanel(); }
function setTab(t) {
  ui.tab = t; ui.slotSel = null; ui.resetArm = 0;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  renderPanel(); $('panel').scrollTop = 0; renderBattleChrome();
}
function renderPanel() {
  const p = $('panel'); ui.rows = {};
  if (ui.tab === 'heroes') p.innerHTML = heroesHTML();
  else if (ui.tab === 'summon') p.innerHTML = summonHTML();
  else if (ui.tab === 'party') p.innerHTML = partyHTML();
  else if (ui.tab === 'collection') p.innerHTML = collectionHTML();
  else p.innerHTML = settingsHTML();
  if (ui.tab === 'heroes') {
    p.querySelectorAll('.hrow').forEach(r => {
      const b = r.querySelectorAll('.hbtns .btn');
      ui.rows[r.dataset.id] = { lv: r.querySelector('.lv'), dps: r.querySelector('.dps'), ms: r.querySelector('.ms'), clv: r.querySelector('.clv'), b1: b[0], b10: b[1], bm: b[2] };
    });
  }
  refreshPanel();
}
function refreshPanel() {      // cheap periodic refresh (no DOM rebuild, so taps are never lost)
  if (ui.tab === 'heroes') {
    setText($('hdps'), 'Party DPS ' + fmt(partyDPS(false)));
    for (const id in ui.rows) {
      const r = ui.rows[id], o = S.heroes[id]; if (!o) continue;
      setText(r.lv, String(o.lvl)); setText(r.clv, 'Lv' + o.lvl); setText(r.dps, fmt(heroShownDPS(id)));
      setText(r.ms, '×' + CONFIG.milestoneMult + ' DPS at Lv ' + (Math.floor(o.lvl / CONFIG.milestoneEvery) + 1) * CONFIG.milestoneEvery);
      const c1 = lvlCost(id, 1), c10 = lvlCost(id, 10), m = maxLevels(id);
      setBtn(r.b1, '+1', c1, S.gold >= c1); setBtn(r.b10, '+10', c10, S.gold >= c10);
      setBtn(r.bm, m > 0 ? 'Max +' + m : 'Max', m > 0 ? lvlCost(id, m) : c1, m > 0);
    }
  } else if (ui.tab === 'summon') {
    const b1 = $('sm1'), b10 = $('sm10');
    if (b1) { b1.classList.toggle('off', S.stars < CONFIG.pullCost); b10.classList.toggle('off', S.stars < CONFIG.tenPullCost); b10.classList.toggle('glowpulse', !S.tut && S.stars >= CONFIG.tenPullCost); }
  }
}
function setBtn(b, label, cost, ok) {
  const t = label + '|' + fmt(cost);
  if (b._t !== t) { b._t = t; b.innerHTML = `${label}<small>🪙 ${fmt(cost)}</small>`; }
  b.classList.toggle('off', !ok);
}
function heroesHTML() {
  return `<div class="sec">Heroes <span id="hdps"></span></div>` + ownedSorted().map(id => {
    const h = H[id], inP = S.party.indexOf(id) >= 0;
    return `<div class="hrow${inP ? ' inparty' : ''}" data-id="${id}"><div class="htop">${cardHTML(id, 52, { cls: 'sm', lvl: 1 })}
      <div class="hinfo"><div class="hname"><span class="tag ${h.rar}">${h.rar}</span>${h.full}</div>
      <div class="hsub">${CLASSES[h.cls].emoji} ${CLASSES[h.cls].name} · ${ELEMENTS[h.el]} · ${CLASSES[h.cls].desc}</div>
      <div class="hstat">Lv <b class="lv"></b> · DPS <b class="dps"></b>${inP ? '<i>🛡️ in party</i>' : '<i>benched</i>'}</div>
      <div class="hsub ms"></div></div></div>
      <div class="hbtns"><button class="btn" data-act="lvl" data-id="${id}" data-n="1"></button><button class="btn" data-act="lvl" data-id="${id}" data-n="10"></button><button class="btn gold" data-act="lvl" data-id="${id}" data-n="max"></button></div></div>`;
  }).join('');
}
function summonHTML() {
  const f = H[CONFIG.featured], R = CONFIG.rarities;
  return `<div class="banner">${cardHTML(f.id, 92)}<div class="binfo"><div class="btitle">Starfall Banner</div>
    <div class="bfeat">Featured SSR: <b>${f.full}</b><br>${pct(CONFIG.featuredChance)} of all SSRs are ${f.short}.</div>
    <div class="pity">SSR guaranteed in ${CONFIG.pitySSR - S.pity}</div></div></div>
    <div class="sbtns"><button class="btn cyan" id="sm1" data-act="summon" data-n="1">Summon ×1<small>${CONFIG.pullCost} 🌠</small></button>
    <button class="btn gold" id="sm10" data-act="summon" data-n="10">Summon ×10<small>${CONFIG.tenPullCost} 🌠 · SR+ guaranteed</small></button></div>
    <details><summary>Rates &amp; rules</summary><div class="dbody">
      <span class="cSSR">SSR ${+(R.SSR.rate * 100).toFixed(2)}%</span> · <span class="cSR">SR ${+(R.SR.rate * 100).toFixed(2)}%</span> · <span class="cR">R ${+(R.R.rate * 100).toFixed(2)}%</span><br>
      • Pity: pull ${CONFIG.pitySSR} without an SSR is a guaranteed SSR.<br>• ×10 always contains at least one SR or better.<br>
      • Duplicates give +1 Awakening (+${pct(CONFIG.awakenBonus)} DPS, max ${CONFIG.maxAwaken}).<br>• Duplicates of a fully awakened hero become gold worth ${CONFIG.dupGoldMinutes} minutes of farm income.<br>
      • Shooting stars are earned only by playing — there is nothing to buy.</div></details>
    <details><summary>History (last ${CONFIG.historyMax})</summary><div class="dbody">${S.history.length ? S.history.map((x, i) =>
      `<div class="hist"><span class="c${H[x.id].rar}">${H[x.id].rar} · ${H[x.id].full}</span><span>#${i + 1}</span></div>`).join('') : 'No summons yet.'}</div></details>`;
}
function partyHTML() {
  const w5 = colW(5, 6), w4 = colW(4, 8), ps = partyStats(), T = CONFIG.team;
  const bonus = (key, label, v) => `<div class="bonus${ps.team.key === key ? ' on' : ''}"><span>${ps.team.key === key ? '✅ ' : ''}${label}</span><span>+${pct(v)} party DPS</span></div>`;
  return `<div class="sec">Party <span>DPS ${fmt(partyDPS(false))}</span></div>
    <div class="pslots">${S.party.map((id, i) => `<div class="pslot${ui.slotSel === i ? ' sel' : ''}" data-act="slot" data-i="${i}">${id ? cardHTML(id, w5, { lvl: 1 }) : `<div class="pempty" style="--w:${w5}px">+</div>`}</div>`).join('')}</div>
    ${bonus('element3', '3+ heroes of one element', T.element3)}${bonus('element5', '5 heroes of one element', T.element5)}${bonus('classes5', '5 different classes', T.classes5)}
    <div class="pstats"><span class="chip">Team bonus: ${ps.team.key ? '+' + pct(ps.team.mult - 1) : 'none'}</span><span class="chip">💥 Crit ${pct(ps.crit)}</span><span class="chip">👆 Tap ×${ps.tapMult.toFixed(1)}</span><span class="chip">✨ Healers ×${(ps.partyMult / ps.team.mult).toFixed(1)}</span></div>
    <div class="hint">${ui.slotSel != null ? '<b>Slot ' + (ui.slotSel + 1) + ' selected</b> — now tap a hero below to put them there.' : 'Tap a hero to add or remove them. To swap, tap a slot first, then a hero. Only the best team bonus applies.'}</div>
    <div class="grid">${ownedSorted().map(id => cardHTML(id, w4, { lvl: 1, attr: `data-act="phero" data-id="${id}"`, extra: S.party.indexOf(id) >= 0 ? '<span class="inp">✓</span>' : '' })).join('')}</div>`;
}
function collectionHTML() {
  const w = colW(4, 8), n = Object.keys(S.heroes).length;
  return `<div class="sec">Collection <span>${n} / ${HEROES.length}</span></div><div class="grid">${HEROES.map(h =>
    cardHTML(h.id, w, { locked: !S.heroes[h.id], attr: `data-act="info" data-id="${h.id}"` })).join('')}</div>`;
}
function settingsHTML() {
  return `<div class="sec">Settings</div>
    <div class="row"><div class="lbl">Auto-advance<small>Move to the next stage after ${CONFIG.enemiesPerStage} kills</small></div><button class="btn ${S.auto ? 'cyan' : 'ghost'}" data-act="auto">${S.auto ? 'ON' : 'OFF'}</button></div>
    <div class="box"><div class="lbl"><b>Export save</b></div>
      ${ui.exportOpen ? `<textarea id="exptxt" readonly>${exportCode()}</textarea><div class="brow"><button class="btn cyan" data-act="copy">Copy</button><button class="btn ghost" data-act="export">Refresh</button></div><div class="msg" id="expmsg"></div>`
        : `<div class="hint">Get a text code you can keep somewhere safe.</div><button class="btn ghost" data-act="export">Show save code</button>`}</div>
    <div class="box"><div class="lbl"><b>Import save</b></div><textarea id="imptxt" placeholder="Paste a save code here" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="brow"><button class="btn ghost" data-act="import">Import</button></div><div class="msg" id="impmsg"></div></div>
    <div class="row"><div class="lbl">Reset save<small>Erase all progress. Cannot be undone.</small></div><button class="btn red" id="resetbtn" data-act="reset">${ui.resetArm ? 'Tap again to erase' : 'Reset'}</button></div>
    ${storageOK ? '' : '<div class="hint">⚠️ Storage is unavailable in this browser mode — progress will not be saved. Use Export to keep a backup.</div>'}
    <button id="ver" data-act="ver">Starfall Idle v${CONFIG.version} · save v${CONFIG.saveVersion}</button>
    ${ui.debug ? `<div class="box"><div class="lbl"><b>🛠 Debug</b></div><div class="dbg" style="margin-top:8px">
      <button class="btn ghost" data-act="dbg" data-k="gold">+1M gold</button><button class="btn ghost" data-act="dbg" data-k="stars">+5000 stars</button>
      <button class="btn ghost" data-act="dbg" data-k="skip">Skip 10 stages</button><button class="btn ghost" data-act="dbg" data-k="offline">Simulate 1h offline</button>
      <button class="btn ghost" data-act="dbg" data-k="pity">Reset pity</button><button class="btn ghost" data-act="dbg" data-k="sky">Spawn shooting star</button></div></div>` : ''}`;
}

/* ---------- modal / toast ---------- */
const modalQ = [];
function showModal(html) { modalQ.push(html); if ($('modal').hidden) nextModal(); }
function nextModal() {
  const m = $('modal');
  if (!modalQ.length) { m.hidden = true; m.innerHTML = ''; renderBattleChrome(); return; }
  m.innerHTML = '<div class="mcard">' + modalQ.shift() + '</div>'; m.hidden = false; renderBattleChrome();
}
function toast(txt) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = txt;
  el.addEventListener('animationend', () => el.remove());
  const box = $('toasts'); while (box.childElementCount >= 3) box.firstElementChild.remove();
  box.appendChild(el);
}
function heroInfo(id) {
  const h = H[id], own = S.heroes[id], c = CLASSES[h.cls];
  if (!own) { showModal(`${cardHTML(id, 110, { locked: 1 })}<h2>???</h2><p>${h.rar} hero — not yet summoned.</p><button class="btn ghost wide" data-act="modal-close">Close</button>`); return; }
  showModal(`${cardHTML(id, 120)}<h2>${h.full}</h2><p><span class="tag ${h.rar}">${h.rar}</span> ${ELEMENTS[h.el]} · ${c.emoji} ${c.name}</p>
    <p>Passive: <b>${c.desc}</b> (while in the party)</p><p>Lv ${own.lvl} · Awakening ${own.awk}/${CONFIG.maxAwaken} · DPS ${fmt(heroShownDPS(id))}</p>
    <button class="btn ghost wide" data-act="modal-close">Close</button>`);
}

/* ---------- actions ---------- */
function act(a, el) {
  switch (a) {
    case 'tab': setTab(el.dataset.tab); break;
    case 'auto': S.auto = !S.auto; if (S.auto && S.kills >= CONFIG.enemiesPerStage && !S.farming && !isBoss(S.stage)) { setStage(S.stage + 1); spawn(); }
      renderBattleChrome(); if (ui.tab === 'settings') renderPanel(); saveGame(); break;
    case 'next': goNext(); renderBattleChrome(); break;
    case 'lvl': {
      const id = el.dataset.id, k = el.dataset.n === 'max' ? maxLevels(id) : +el.dataset.n;
      if (k < 1) return; const c = lvlCost(id, k);
      if (S.gold < c) return;
      S.gold -= c; S.heroes[id].lvl += k; refreshPanel(); renderPartyRow(); renderBattleChrome(); break;
    }
    case 'summon': doSummon(+el.dataset.n); break;
    case 'sm-flip': if (SM.phase === 'cards') smFlip(+el.dataset.i); break;
    case 'sm-skip': smSkip(); break;
    case 'sm-again': if (SM.done) doSummon(SM.n); break;
    case 'slot': { const i = +el.dataset.i; ui.slotSel = ui.slotSel === i ? null : i; renderPanel(); break; }
    case 'phero': {
      const id = el.dataset.id, idx = S.party.indexOf(id), sel = ui.slotSel;
      if (sel != null) { if (idx >= 0) { S.party[idx] = S.party[sel]; } S.party[sel] = id; ui.slotSel = null; }
      else if (idx >= 0) S.party[idx] = null;
      else { const e = S.party.indexOf(null); if (e >= 0) S.party[e] = id; else { toast('Party is full — tap a slot first, then a hero to swap.'); return; } }
      renderAll(); saveGame(); break;
    }
    case 'info': heroInfo(el.dataset.id); break;
    case 'modal-close': nextModal(); break;
    case 'export': ui.exportOpen = true; saveGame(); renderPanel(); break;
    case 'copy': {
      const t = $('exptxt'), done = ok => { const m = $('expmsg'); if (m) { m.textContent = ok ? 'Copied to clipboard ✓' : 'Could not copy — select the text and copy it manually.'; m.className = 'msg' + (ok ? '' : ' err'); } };
      const fallback = () => { try { t.focus(); t.select(); t.setSelectionRange(0, 999999); done(document.execCommand('copy')); t.blur(); } catch (e) { done(false); } };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(() => done(true), fallback); else fallback(); } catch (e) { fallback(); }
      break;
    }
    case 'import': {
      const code = $('imptxt').value, m = $('impmsg');
      if (!code.trim()) { m.textContent = 'Paste a save code first.'; m.className = 'msg err'; return; }
      if (importCode(code)) { E = null; spawn(); renderAll(); $('impmsg').textContent = 'Save imported ✓'; toast('Save imported'); }
      else { m.textContent = 'That code is not a valid save.'; m.className = 'msg err'; }
      break;
    }
    case 'reset':
      if (ui.resetArm && Date.now() - ui.resetArm < 4000) {
        try { localStorage.removeItem(CONFIG.saveKey); } catch (e) {}
        S = newState(); lastT = Date.now(); ui.resetArm = 0; E = null; spawn(); checkDaily(); saveGame(); setTab('heroes'); renderAll(); welcome();
      } else { ui.resetArm = Date.now(); el.textContent = 'Tap again to erase'; setTimeout(() => { if (ui.resetArm && Date.now() - ui.resetArm >= 3900) { ui.resetArm = 0; const b = $('resetbtn'); if (b) b.textContent = 'Reset'; } }, 4000); }
      break;
    case 'ver': if (++ui.verTaps >= 5 && !ui.debug) { ui.debug = true; toast('🛠 Debug panel unlocked'); renderPanel(); $('panel').scrollTop = 99999; } break;
    case 'dbg': {
      const k = el.dataset.k;
      if (k === 'gold') { S.gold += 1e6; bump('curgold'); }
      else if (k === 'stars') addStars(5000);
      else if (k === 'skip') { S.farming = false; setStage(S.stage + 10); spawn(); }
      else if (k === 'offline') applyOffline(3600);
      else if (k === 'pity') { S.pity = 0; toast('Pity reset'); }
      else if (k === 'sky') spawnSkyStar();
      renderBattleChrome(); saveGame(); break;
    }
  }
}
function welcome() {
  showModal(`<div class="ico">🌠</div><h2>Welcome, Summoner!</h2><p>The stars have chosen you. <b>Tomo, Village Guard</b> is already fighting at your side.</p>
    <div class="big s">+${CONFIG.startStars} 🌠</div><p>A gift of Shooting Stars — exactly enough for your first <b>10-pull</b>. Head to the <b>Summon</b> tab!</p>
    <p>Tap enemies to hit harder, and tap shooting stars in the sky to catch them.</p><button class="btn gold wide" data-act="modal-close">Let's go!</button>`);
}

/* =====================================================================
   MAIN LOOP — all logic runs on real elapsed time
   ===================================================================== */
let lastT = Date.now(), slowAcc = 0, saveAcc = 0, hiddenNow = false;
function step() {
  const now = Date.now(); let dt = (now - lastT) / 1000; lastT = now;
  if (dt < 0) dt = 0;
  if (dt >= CONFIG.offlineMinSec) { applyOffline(dt); dt = 0; saveAcc = CONFIG.autosaveSec; }  // was away: pay offline instead of simulating
  if (dt > 0) simulate(dt);
  const vis = Math.min(dt, 1);                 // things that only tick while actually on screen
  skyTimer -= vis;
  if (skyTimer <= 0) { skyTimer = rand(CONFIG.skyStarMinSec, CONFIG.skyStarMaxSec); if (!SM.active) spawnSkyStar(); else skyTimer = 5; }
  slowAcc += dt; saveAcc += dt;
  if (slowAcc >= 0.25) { slowAcc = 0; checkDaily(); refreshPanel(); uiDirty = true; }
  if (saveAcc >= CONFIG.autosaveSec) { saveAcc = 0; saveGame(); }
  if (uiDirty) { uiDirty = false; renderBattleChrome(); }
  drawFrame();
  if (SM.active) smFrame(Math.min(dt, 0.05));
}
function frame() { requestAnimationFrame(frame); if (!hiddenNow) step(); }

function init() {
  loadGame();
  lastT = isNewPlayer ? Date.now() : (S.lastSeen || Date.now());   // first step() pays offline gold if we were away 60s+
  if (lastT > Date.now()) lastT = Date.now();
  // background stars
  let sky = '<div class="moon"></div>';
  for (let i = 0; i < 44; i++) sky += `<i style="left:${rand(0, 100).toFixed(1)}%;top:${rand(0, 78).toFixed(1)}%;animation-delay:${rand(-3, 0).toFixed(2)}s;${Math.random() < .2 ? 'width:3px;height:3px' : ''}"></i>`;
  $('sky').innerHTML = sky;
  // input
  document.addEventListener('click', ev => { const el = ev.target.closest('[data-act]'); if (el) act(el.dataset.act, el); });
  $('ezone').addEventListener('pointerdown', onTap);
  ['gesturestart', 'gesturechange', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('contextmenu', e => { if (e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
  document.addEventListener('visibilitychange', () => {
    hiddenNow = document.hidden;
    if (hiddenNow) saveGame(); else step();
  });
  window.addEventListener('pagehide', saveGame);
  window.addEventListener('pageshow', () => { hiddenNow = document.hidden; });
  window.addEventListener('resize', () => { if (E) renderEnemy(); renderPanel(); });
  // home-screen icon drawn at runtime (no image files)
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 180); gr.addColorStop(0, '#0a0b2e'); gr.addColorStop(1, '#5a2a6e'); g.fillStyle = gr; g.fillRect(0, 0, 180, 180);
    g.font = '110px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🌠', 90, 98);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) {}
  setTab('heroes'); spawn(); renderAll();
  if (isNewPlayer) welcome();
  checkDaily();
  step(); saveGame();
  requestAnimationFrame(frame);
}
init();
</script>
